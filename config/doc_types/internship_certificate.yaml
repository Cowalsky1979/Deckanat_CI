key: internship_certificate
title: Справка о практике
rules_section: "5"
detect:
  title_keywords: ["справка о практике", "о практике", "о прохождении практики"]
  label_keywords: ["название организации", "дата начала практики", "руководителя практики", "оценка"]
complete_message_rules: ["5.1", "5.2", "5.3"]
fields:
  - key: student_name
    label: ФИО студента
    aliases: ["фио", "фамилия", "имя студента", "как зовут студента", "кто студент", "кто проходил практику"]
    type: person_name
    rule: "5.1"
  - key: organization
    label: Название организации
    aliases: ["организация", "где проходила практика", "место практики", "компания", "предприятие"]
    type: text
    rule: "5.1"
  - key: internship_start
    label: Дата начала практики
    aliases: ["начало практики", "с какого числа практика", "когда началась практика"]
    type: date
    rule: "5.1"
  - key: internship_end
    label: Дата окончания практики
    aliases: ["окончание практики", "конец практики", "до какого числа практика", "когда закончилась практика"]
    type: date
    rule: "5.1"
  - key: supervisor_name
    label: ФИО руководителя практики
    aliases: ["руководитель практики", "кто руководитель", "кто руководил практикой", "фио руководителя"]
    type: person_name
    rule: "5.1"
  - key: grade
    label: Оценка
    aliases: ["какая оценка", "оценка за практику", "на что сдал практику", "результат практики"]
    type: enum
    values: ["отлично", "хорошо", "удовлетворительно", "неудовлетворительно", "зачтено", "не зачтено"]
    rule: "5.1"
  - key: document_number
    label: Номер справки
    aliases: ["номер документа", "какой номер у справки"]
    type: doc_number
    rule: "5.1"
  - key: issue_date
    label: Дата выдачи
    aliases: ["когда выдана", "дата выдачи справки", "когда выдали"]
    type: date
    rule: "5.1"
  - key: signature_present
    label: Подпись руководителя
    aliases: ["подписана ли", "есть ли подпись", "подписал ли руководитель"]
    type: signature
    anchor: "подпись руководителя"
    rule: "5.2"
  - key: seal_present
    label: Печать организации
    aliases: ["есть ли печать", "стоит ли печать", "м.п."]
    type: seal
    anchor: "м.п."
    rule: "5.3"
