key: academic_leave_application
title: Заявление на академический отпуск
rules_section: "4"
detect:
  title_keywords: ["заявление на академический отпуск", "академический отпуск", "заявление"]
  label_keywords: ["учебная группа", "курс", "причина отпуска", "дата начала отпуска", "дата заявления"]
complete_message_rules: ["4.1", "4.2"]
# Пункты, которые объясняют, почему некоторых отметок у этого типа нет
not_required:
  seal: "4.3"
fields:
  - key: student_name
    label: ФИО студента
    aliases: ["фио", "фамилия", "имя студента", "как зовут студента", "кто студент", "кто подаёт заявление"]
    type: person_name
    rule: "4.1"
  - key: group
    label: Учебная группа
    aliases: ["номер группы", "в какой группе"]
    type: group
    rule: "4.1"
  - key: course
    label: Курс
    aliases: ["на каком курсе", "номер курса", "какой курс"]
    type: int
    rule: "4.1"
  - key: leave_reason
    label: Причина отпуска
    aliases: ["почему отпуск", "основание отпуска", "в связи с чем"]
    type: text
    rule: "4.1"
  - key: leave_start
    label: Дата начала отпуска
    aliases: ["начало отпуска", "с какого числа отпуск", "когда начинается отпуск", "начало академического отпуска"]
    type: date
    rule: "4.1"
  - key: leave_end
    label: Дата окончания отпуска
    aliases: ["окончание отпуска", "конец отпуска", "до какого числа отпуск", "когда заканчивается отпуск"]
    type: date
    rule: "4.1"
  - key: application_date
    label: Дата заявления
    aliases: ["когда подано заявление", "дата подачи", "когда написано заявление", "число заявления"]
    type: date
    rule: "4.1"
  - key: signature_present
    label: Подпись студента
    aliases: ["подписано ли", "есть ли подпись", "подписал ли студент"]
    type: signature
    anchor: "подпись студента"
    rule: "4.2"
