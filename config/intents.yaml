# Словари интентов для ответов на вопросы.
# Порядок разбора: decision -> completeness -> field -> faq -> not_established -> no_info.

decision:
  # Кто принимает окончательное решение (п. 1.3)
  patterns:
    - "кто принимает"
    - "кто примет"
    - "кто принимает окончательное решение"
    - "окончательное решение"
    - "кто решает"
    - "кто утверждает"
    - "кто принимает решение"
    - "документ принят"
    - "примут ли документ"
    - "примут ли"
    - "приняли ли"
    - "принят ли"
    - "кто рассматривает"

completeness:
  patterns:
    - "все обязательные сведения"
    - "обязательные сведения"
    - "обязательные поля"
    - "комплектн"
    - "полный ли"
    - "полная ли"
    - "чего не хватает"
    - "что не хватает"
    - "чего нет"
    - "всё ли в порядке"
    - "все ли в порядке"
    - "в порядке"
    - "подходит ли"
    - "достаточно ли"
    - "хватит ли"
    - "хватает ли"
    - "проверь документ"
    - "проверить документ"
    - "проверь справку"
    - "проверь заявление"
    - "всё ли заполнено"
    - "все ли заполнено"
    - "правильно ли заполнен"
    - "корректн"
    - "годится ли"
    - "можно ли подать"
    - "примет ли деканат"

# Вопросы о флагах (подпись/печать) распознаются как вопросы о полях через aliases в конфиге типов.

# фразы, по которым вопрос считается вопросом о значении поля
field_phrases: ["значение поля", "укажи поле", "поле ", "какое значение", "что указано в поле", "что написано в поле"]

# темы, которых нет ни в документе, ни в Положении (поле ищется только по точному названию)
foreign_topics:
  - "стипенд"
  - "стоимост"
  - "цена"
  - "оплат"
  - "платн"
  - "телефон"
  - "кабинет"
  - "адрес"
  - "срок рассмотр"
  - "сколько дней"
  - "режим работы"
  - "часы работы"
  - "общежит"
  - "почт"
  - "email"
  - "e-mail"
  - "сайт"
  - "расписан"
  - "пересдач"
  - "диплом"
  - "отчисл"
  - "восстанов"
  - "льгот"
  - "скидк"

faq:
  # Вопросы, на которые Положение отвечает прямо. value - короткий ответ, rule - пункт.
  - id: authenticity
    patterns: ["подлинност", "настоящая ли подпись", "настоящая ли печать", "поддельн", "фальшив"]
    rule: "2.3"
    value: "подлинность не проверяется"
    answer: "Подлинность подписи и печати сервис не проверяет — проверяется только наличие графического элемента (пункт 2.3 Положения)."
  - id: date_format
    patterns: ["формат дат", "в каком формате дат", "как записывать дату", "формат даты"]
    rule: "2.5"
    value: "ГГГГ-ММ-ДД"
    answer: "Даты при извлечении приводятся к формату ГГГГ-ММ-ДД; для периодов отдельно извлекаются начало и окончание (пункт 2.5 Положения)."
  - id: sources
    patterns: ["откуда берётся ответ", "откуда берется ответ", "на основании чего", "источник ответа", "какие источники"]
    rule: "2.1"
    value: "документ и Положение"
    answer: "Источниками ответа служат только загруженный документ и Положение; ответ ссылается на поля документа и пункты Положения (пункт 2.1 Положения)."
  - id: what_ok_means
    patterns: ["что значит документ в порядке", "что означает в порядке", "что такое предварительная проверка", "что проверяет сервис", "что проверяется"]
    rule: "2.6"
    value: "наличие всех обязательных полей и отметок"
    answer: "Для этого учебного набора «документ в порядке» означает наличие всех полей и графических отметок, обязательных для выбранного типа; юридическая сила, подлинность и сроки не проверяются (пункт 2.6 Положения)."
  - id: pages
    patterns: ["сколько страниц", "одной страницы", "нужна ли вторая страница", "несколько страниц", "двухсторонн"]
    rule: "3.4"
    value: "достаточно одной страницы"
    answer: "Для проверки достаточно одной страницы справки (пункт 3.4 Положения)."
  - id: supported_types
    patterns: ["какие документы поддерживаются", "какие типы документов", "какие документы можно", "что можно загрузить", "какие справки"]
    rule: "1.2"
    value: "справка об обучении, заявление на академический отпуск, справка о практике"
    answer: "Поддерживаются справка об обучении, заявление на академический отпуск и справка о практике; тип документа можно выбрать вручную (пункт 1.2 Положения)."
  - id: not_accept
    patterns: ["оформит ли сервис", "оформляет ли", "сервис принимает документы", "можно ли через сервис оформить", "зачтёт ли сервис", "зачтет ли сервис"]
    rule: "1.3"
    value: "сервис не принимает документы"
    answer: "Сервис не сообщает «документ принят» и не оформляет перевод, отпуск или зачёт практики — окончательное решение принимает сотрудник деканата (пункт 1.3 Положения)."
  - id: leave_reason_enough
    patterns: ["достаточно ли причины", "подходит ли причина", "уважительная ли причина", "допустима ли причина", "нужны ли подтверждающие документы", "подтверждающие документы"]
    rule: "4.4"
    value: "достаточно непустой причины"
    answer: "Для предварительной проверки достаточно указанной непустой причины отпуска; допустимость причины и подтверждающие документы настоящим Положением не оцениваются (пункт 4.4 Положения)."
  - id: required_fields_study
    doc_types: ["study_certificate"]
    patterns: ["какие поля обязательны", "что должно быть в справке", "какие сведения обязательны", "что обязательно"]
    rule: "3.1"
    extra_rules: ["3.2", "3.3"]
    value: "ФИО студента, название вуза, направление подготовки, форма обучения, начало и окончание периода обучения, номер справки, дата выдачи, подпись сотрудника, печать вуза"
    answer: "Для справки об обучении обязательны: ФИО студента, название вуза, направление подготовки, форма обучения, начало и окончание периода обучения, номер справки, дата выдачи (пункт 3.1), подпись уполномоченного сотрудника (пункт 3.2) и печать вуза (пункт 3.3)."
  - id: required_fields_leave
    doc_types: ["academic_leave_application"]
    patterns: ["какие поля обязательны", "что должно быть в заявлении", "какие сведения обязательны", "что обязательно"]
    rule: "4.1"
    extra_rules: ["4.2"]
    value: "ФИО студента, учебная группа, курс, причина отпуска, дата начала и окончания отпуска, дата заявления, подпись студента"
    answer: "Для заявления на академический отпуск обязательны: ФИО студента, учебная группа, курс, причина отпуска, даты начала и окончания отпуска, дата заявления (пункт 4.1) и подпись студента (пункт 4.2)."
  - id: required_fields_internship
    doc_types: ["internship_certificate"]
    patterns: ["какие поля обязательны", "что должно быть в справке", "какие сведения обязательны", "что обязательно"]
    rule: "5.1"
    extra_rules: ["5.2", "5.3"]
    value: "ФИО студента, название организации, даты начала и окончания практики, ФИО руководителя практики, оценка, номер справки, дата выдачи, подпись руководителя, печать организации"
    answer: "Для справки о практике обязательны: ФИО студента, название организации, даты начала и окончания практики, ФИО руководителя практики, оценка, номер справки, дата выдачи (пункт 5.1), подпись руководителя практики (пункт 5.2) и печать организации (пункт 5.3)."

not_established:
  # Темы, про которые Положение прямо говорит, что они им не установлены.
  # Ответ: answerable=false, но в тексте поясняем, какой пункт это фиксирует.
  - id: transfer_course
    patterns: ["курс перевода", "на какой курс", "перевод на", "перевест", "перезач", "академическ задолж", "задолженност"]
    rule: "3.5"
    note: "Условия перевода, перезачёта дисциплин и академических задолженностей настоящим Положением не установлены (пункт 3.5)."
  - id: leave_conditions
    patterns: ["максимальная длительность", "максимальный срок отпуска", "на сколько можно", "сохранение выплат", "сохраняется ли стипендия", "выплаты во время отпуска"]
    rule: "4.4"
    note: "Максимальная длительность отпуска и сохранение выплат настоящим Положением не установлены (пункт 4.4)."
  - id: grading_procedure
    patterns: ["как выставляется оценка", "порядок выставления", "зачёт практики", "зачет практики", "требования к отчёту", "требования к отчету", "как зачесть практику"]
    rule: "5.5"
    note: "Порядок выставления оценки, зачёта практики и требования к содержанию отчёта настоящим Положением не установлены (пункт 5.5)."
